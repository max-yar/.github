name: "Backend task"
description: "Backend task under a Story"
title: "[BE] "
labels: ["backend"]
type: Task
body:
  - type: textarea
    id: motivation
    attributes:
      label: "Motivation"
      description: "Backend-relevant slice of the Story's Motivation — why this side matters, one or two sentences."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      description: "What changes — backend only."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: "Out of scope"
      description: "Backend-side exclusion, if different from the Story's."
  - type: textarea
    id: design
    attributes:
      label: "Design"
      description: "Only subsections with something to say — delete the rest, don't leave empty headings."
      value: |
        **Decisions** — only choices local to the backend (the Story's Decisions cover anything that also touches the frontend)

        |**Decision**|**Why**|
        |:---------|:-----|
        |<what was chosen; a rejected alternative is also a row>|<one-line reason>|

        **Data model**

        <new, changed and removed fields and tables; physical schema as an attached diagram with a legend>

        **API**

        <implementation detail beyond the Story's sketch — validation rules, error codes, edge cases>

        **Sequence** — only when this task spans more than one backend service (back / chat / notification / gateway)

        <order of calls or events between those services>

        **Rollout** — same trigger: more than one backend service

        <deploy order between those services — or say order doesn't matter>
  - type: textarea
    id: open-for-implementer
    attributes:
      label: "Open for the implementer"
      description: "Explicitly open: class structure, naming, library choice within the decisions above."
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "Observable: endpoint and field, log line, table and column. Plus compatibility — what still works from before."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: "References"
      description: "External source: documentation, standard, article, design doc or ADR in the repo — one line on why it's worth reading."
